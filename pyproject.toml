[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-fleet"
version = "0.1.3"
description = "Deterministic career and employer screening engine with multi-lane checks and exact quote verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NatesVibeCode" }]
requires-python = ">=3.10"
keywords = ["mcp", "agent-skills", "sqlite", "career-intelligence", "job-search", "evidence-grounding", "ats-discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0",
    "httpx>=0.24.0",
    "mcp>=1.26.0,<2",
    "tzdata>=2022.7",
]

[project.urls]
Homepage = "https://github.com/NatesVibeCode/career-fleet"
Repository = "https://github.com/NatesVibeCode/career-fleet"
Issues = "https://github.com/NatesVibeCode/career-fleet/issues"
Security = "https://github.com/NatesVibeCode/career-fleet/security/policy"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
discover = [
    "ddgs>=8.0",
    "readability-lxml>=0.8",
    "trafilatura>=1.0",
    "pypdf>=4.0",
]
js = [
    "playwright>=1.40",
]

[project.scripts]
career-fleet = "career_fleet.cli:main"
career-lanes = "career_fleet.cli:main"
account-fleet = "free_fleet.cli:main"
free-fleet = "free_fleet.cli:main"
bulk-lanes = "free_fleet.cli:main"

[tool.setuptools.packages.find]
include = ["free_fleet*", "career_fleet*"]

[tool.setuptools.package-data]
career_fleet = [
    "resources/skill/career-fleet/*.md",
    "resources/skill/career-fleet/references/*.md",
]
free_fleet = [
    "migrations/*.sql",
    "data/*.json",
    "resources/skill/*.md",
    "resources/skill/references/*.md",
    "resources/skill/agents/*.yaml",
    "resources/account_skill/*.md",
    "resources/account_skill/references/*.md",
    "resources/examples/account_research/*.json",
    "resources/examples/account_research/*.csv",
]

[tool.setuptools.data-files]
"share/free-fleet/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]
