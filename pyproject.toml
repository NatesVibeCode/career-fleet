[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "career-fleet"
version = "0.5.0"
description = "Deterministic career and employer screening engine with multi-lane checks and exact quote verification."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NatesVibeCode" }]
requires-python = ">=3.10"
keywords = ["mcp", "agent-skills", "sqlite", "career-intelligence", "job-search", "evidence-grounding", "ats-discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.0.0",
    "jsonschema>=4.20.0",
    "httpx>=0.24.0",
    "mcp>=1.26.0,<2",
    "tzdata>=2022.7",
]

[project.urls]
Homepage = "https://github.com/NatesVibeCode/career-fleet"
Repository = "https://github.com/NatesVibeCode/career-fleet"
Issues = "https://github.com/NatesVibeCode/career-fleet/issues"
Security = "https://github.com/NatesVibeCode/career-fleet/security/policy"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
discover = [
    "ddgs>=8.0",
    "readability-lxml>=0.8",
    "trafilatura>=1.0",
    "pypdf>=4.0",
]
js = [
    "playwright>=1.40",
]

[project.scripts]
career-fleet = "career_fleet.cli:main"

[tool.setuptools.packages.find]
include = ["harness_fleet*", "career_fleet*"]

[tool.setuptools.package-data]
career_fleet = [
    "resources/skill/career-fleet/*.md",
    "resources/skill/career-fleet/references/*.md",
    "resources/board/*.html",
]
harness_fleet = [
    "migrations/*.sql",
    "data/*.json",
    "resources/harness_skill/*.md",
    "resources/harness_skill/references/*.md",
    "resources/harness_skill/agents/*.yaml",
    "resources/examples/career_screening/*.json",
    "resources/examples/career_screening/*.csv",
    "resources/studio/*.html",
    "resources/board/*.html",
]

[tool.setuptools.data-files]
"share/harness-fleet/schemas" = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Curated: no S/BLE/TRY/SIM churn, no line-length. E731/N/B905 findings are
# fixed, not waived; PLR0124 marks only the two intentional NaN checks.
select = ["E", "F", "I", "N", "UP", "B", "PLR0124"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["ddgs.*", "pdfminer.*", "pypdf", "jsonschema", "playwright.*", "trafilatura", "readability"]
ignore_missing_imports = true

# calibrate's nested-sweep nonlocal bindings are runtime-proven (the module
# compiles, so the bindings exist); mypy's scope analysis false-positives
# here, and inline ignores are invalid on nonlocal statements.
[[tool.mypy.overrides]]
module = "harness_fleet.calibrate"
disable_error_code = ["misc"]
